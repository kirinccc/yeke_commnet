server:
  port: 8081
spring:
  profiles:
    active: local
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yeke_comment}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 10MB # 默认仅 1MB，探店笔记图片会超限
      max-request-size: 10MB
# 阿里云 OSS 对象存储（AK/SK 属于敏感信息，也可通过同名环境变量覆盖）
aliyun:
  oss:
    endpoint: oss-cn-shanghai.aliyuncs.com # 上海地域，不带 https://
    access-key-id: ${OSS_ACCESS_KEY_ID:} # 取自系统环境变量
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:} # 取自系统环境变量
    bucket-name: yeke-commnet
    dir: ${ALIYUN_OSS_DIR:hmdp/} # 上传到 bucket 下的目录前缀
    domain: ${ALIYUN_OSS_DOMAIN:} # 可选，CDN/自定义域名，如 https://img.xxx.com
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
